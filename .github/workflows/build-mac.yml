name: build-mac

# 没有 Mac 也能出 dmg：把仓库推到 GitHub，点一次 Run workflow，
# 苹果机器会帮你打好 arm64 / x64 两个 dmg，跑完在页面底部下载。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple Silicon（M 系列）
            arch: arm64
          - os: macos-13      # Intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包 dmg
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
